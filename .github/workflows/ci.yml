name: CI

on:
  push:
    branches: [develop, staging, main]
  # Every PR, whatever its target (stacked PRs such as Phase 6 -> phase0/security-hardening included).
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # Every Monday at 06:00 UTC

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: "true"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Job 1: Frontend lint, format, and type check
  # ─────────────────────────────────────────────────────────────────────────────
  lint-and-format:
    name: Lint and Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript type check
        run: pnpm run typecheck

      - name: RBAC permission parity
        run: pnpm run rbac:check

      - name: ESLint
        run: pnpm run lint:check

      - name: Prettier format check
        run: pnpm run format:check

      - name: Migration integrity check
        run: pnpm run migrate:check

      - name: Check CHANGELOG has Unreleased entry (PRs to main only)
        if: github.base_ref == 'main'
        shell: bash
        run: |
          set -euo pipefail

          # Extract lines after "## [Unreleased]" up to (but not including) the next "## ["
          unreleased_section="$(
            awk '
              $0 ~ /^## \[Unreleased\]/ {in_unreleased=1; next}
              in_unreleased && $0 ~ /^## \[/ {exit}
              in_unreleased {print}
            ' CHANGELOG.md
          )"

          # Require at least one bullet entry under Unreleased
          if ! printf '%s\n' "$unreleased_section" | grep -Eq '^[[:space:]]*-[[:space:]]+'; then
            echo "ERROR: CHANGELOG.md must have at least one bullet entry under [Unreleased] before merging to main."
            exit 1
          fi

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 2: Rust lint, format, and tests
  # ─────────────────────────────────────────────────────────────────────────────
  rust-quality:
    name: Rust Quality
    # Pinned: `ubuntu-latest` is moving to Ubuntu 26, and this job was losing its runner (exit 143).
    runs-on: ubuntu-24.04
    env:
      # One ~400,000-line crate: linking its test executables with full debug info (several at once) exhausted
      # the 16 GB runner. Line tables keep file:line in backtraces; incremental compilation is useless in CI.
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Safety net against an out-of-memory kill during the test build. On the runner's temporary disk.
      - name: Add swap
        run: |
          sudo swapoff -a || true
          sudo fallocate -l 8G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -m
          df -h / /mnt

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # Keyed on the toolchain, Cargo.lock and the job; keeps dependency builds, drops our own crate.
      - name: Cache Cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsqlite3-dev \
            libssl-dev

      - name: Rust format check
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Clippy — deny warnings
        working-directory: src-tauri
        run: cargo clippy -- -D warnings

      # The whole suite, once: unit tests, integration tests (rams_golden, ...) and doc tests.
      # The schema integration tests and RAMS golden benchmarks are part of it.
      - name: Rust tests
        working-directory: src-tauri
        env:
          # At most two of the big test-executable links at a time (the library test, the integration tests, the
          # binary and the cdylib are all links of the same crate).
          CARGO_BUILD_JOBS: "2"
        run: |
          # Memory and disk every 30 s, so a lost runner leaves its last readings in the log.
          ( while true; do echo "[mon] $(date +%H:%M:%S) mem_used_mb=$(free -m | awk 'NR==2{print $3}') swap_used_mb=$(free -m | awk 'NR==3{print $3}') disk_free=$(df -h / | awk 'NR==2{print $4}')"; sleep 30; done ) &
          MON=$!
          trap 'kill "$MON" 2>/dev/null || true' EXIT
          cargo test

      - name: Demo-company generator (developer-only feature)
        working-directory: src-tauri
        env:
          CARGO_BUILD_JOBS: "2"
        run: |
          cargo clippy --features demo-company --bin demo-company -- -D warnings
          cargo test --features demo-company --lib demo_company::

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 3: Frontend tests with coverage
  # ─────────────────────────────────────────────────────────────────────────────
  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    needs: lint-and-format
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Vitest with coverage
        run: pnpm run test --coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 4: Tauri build validation (Windows MSVC target)
  # ─────────────────────────────────────────────────────────────────────────────
  tauri-build-check:
    name: Tauri Build Check
    runs-on: windows-latest
    # Runs alongside Rust Quality instead of after it: the Windows build does not depend on the tests.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable (MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm run build

      - name: Validate Tauri build (no bundle)
        run: pnpm tauri build --no-bundle
        env:
          TAURI_SIGNING_PRIVATE_KEY: ""
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 5: Security audit (runs on PRs to main/staging and on weekly schedule)
  # ─────────────────────────────────────────────────────────────────────────────
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'schedule' ||
      (github.event_name == 'pull_request' &&
       (github.base_ref == 'main' || github.base_ref == 'staging'))
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Rust dependency audit
        working-directory: src-tauri
        run: cargo audit --deny warnings

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: npm dependency audit
        run: pnpm audit --audit-level=high

      - name: Secret scanning with Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
