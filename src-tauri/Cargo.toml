[package]
name = "maintafox"
version = "0.4.0-dev"
edition = "2021"
# Code uses APIs stabilised in 1.80 (LazyLock) and 1.82; declare the real minimum.
rust-version = "1.82"
build = "build.rs"
default-run = "maintafox"

[lib]
name = "maintafox_lib"
# Desktop dev/CI: cdylib + rlib only (faster link; no staticlib .lib artifact).
# Restore "staticlib" before Android/iOS/mobile static linking targets.
crate-type = ["cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = "1"

[dependencies]
tauri = { version = "2", features = ["tray-icon", "protocol-asset"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
# Version order for the update offers this device accepts (updater::accept_offer).
semver = "1"
# OS toasts of notifications, shown from Rust only (no webview permission).
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
sea-orm = { version = "1", features = ["sqlx-sqlite", "runtime-tokio-rustls", "macros"] }
sea-orm-migration = { version = "1", features = ["sqlx-sqlite", "runtime-tokio-rustls"] }
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio", "macros"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"
sysinfo = "0.30"
regex = "1"
anyhow = "1"
base64 = "0.22"
thiserror = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
argon2 = "0.5"
rand = "0.8"
rand_core = { version = "0.6", features = ["getrandom"] }
sha2 = "0.10"
hex = "0.4"
# Ed25519 verification of entitlement envelopes (already in the tree via rustls).
ring = "0.17.14"
# SQLCipher (AES-256 at rest). Feature unification makes sqlx use this build of libsqlite3-sys.
# Building OpenSSL from source needs Perl (Strawberry Perl on Windows; preinstalled on GitHub runners).
libsqlite3-sys = { version = "0.30.1", features = ["bundled-sqlcipher-vendored-openssl"] }
csv = "1"
hostname = "0.4"
sys-locale = "0.3"
keyring = "2"
calamine = "0.30.1"
cron = "0.12.1"
rust_xlsxwriter = "0.79.4"
clap = { version = "4", features = ["derive"] }
toml = "0.8"
# Sync worker HTTP transport (Phase 2.3). Same reqwest/rustls(ring) build as tauri-plugin-updater
# plus `system-proxy` (Windows/macOS proxy settings, as the webview transport had):
# no native-tls/OpenSSL, no aws-lc. The ring provider is installed in `sync::transport::client`.
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider", "system-proxy"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
pdf-writer = "0.12"
ttf-parser = "0.25"

[[bin]]
name = "rams-readiness-eval"
path = "src/bin/rams_readiness_eval.rs"

[dev-dependencies]
chrono = { version = "0.4", features = ["serde"] }
criterion = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"

[[bench]]
name = "reliability_core"
harness = false

# Dev compile speed: CGU=1 was a workaround for sporadic MSVC LNK2019 with cdylib.
# Soak-tested on rustc 1.94.1 / MSVC (2026-07-27): CGU=16 + opt-level=0, no link errors.
[profile.dev]
codegen-units = 16
incremental = true

# Crypto and the encrypted database, optimised even in dev/test builds (the release profile is unchanged).
# At opt-level 0 Argon2id (64 MiB, auth/password.rs), the hashes, Ed25519 verification (ring) and SQLCipher run
# 10-50x slower than release; the CI test run spent most of its 65 minutes in two-PC fixtures that create users
# and open databases. Only the optimisation level changes: debug assertions and overflow checks stay on.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
[profile.dev.package.password-hash]
opt-level = 3
[profile.dev.package.base64ct]
opt-level = 3
[profile.dev.package.digest]
opt-level = 3
[profile.dev.package.crypto-common]
opt-level = 3
[profile.dev.package.subtle]
opt-level = 3
[profile.dev.package.cpufeatures]
opt-level = 3
[profile.dev.package.sha1]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.hmac]
opt-level = 3
[profile.dev.package.hkdf]
opt-level = 3
[profile.dev.package.aes]
opt-level = 3
[profile.dev.package.ring]
opt-level = 3
[profile.dev.package.libsqlite3-sys]
opt-level = 3

[profile.release]
lto = "thin"
opt-level = "s"
strip = true
